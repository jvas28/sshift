name: Feature request
description: Suggest an idea for sshift
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow; what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could sshift help?
